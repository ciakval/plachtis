name: Build and Deploy

on:
  push:
    branches:
      - main
    tags:
      - 'v*'

jobs:
  build-and-push:
    name: Build & Push
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.git_info.outputs.sha }}
    permissions:
      contents: read
      packages: write
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      
      - name: Get version info from Git
        id: git_info
        run: |
          echo "version=$(git describe --tags --abbrev=7 --always)" >> $GITHUB_OUTPUT
          echo "sha=$(git rev-parse HEAD)" >> $GITHUB_OUTPUT
      
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=${{ steps.git_info.outputs.sha }}
            type=raw,value=latest,enable=${{ github.ref_type == 'branch' }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
      
      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ steps.git_info.outputs.version }}
            BUILD_ID=${{ steps.git_info.outputs.sha }}

  # Deploys go through ciakval/bombur-deploy: the DEPLOY_SSH_KEY environment secret only lets
  # CI run "deploy <sha>" for its own app; compose.yaml and .env live on Bombur.
  deploy-test:
    name: Deploy to Test
    needs: build-and-push
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: read
    uses: ciakval/bombur-deploy/.github/workflows/deploy.yml@v1
    with:
      image_tag: ${{ needs.build-and-push.outputs.image_tag }}
      environment: test
      url: https://plachtis-test.remesh.cz
    secrets: inherit

  deploy-production:
    name: Deploy to Production
    needs: build-and-push
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: read
      packages: read
    uses: ciakval/bombur-deploy/.github/workflows/deploy.yml@v1
    with:
      image_tag: ${{ needs.build-and-push.outputs.image_tag }}
      environment: production
      url: https://plachtis.remesh.cz
    secrets: inherit
